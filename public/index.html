<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="WHATUPRG · New Saint Holy Tour. Tour dates, fan POV, the road, and the photobooth.">
<meta property="og:title" content="New Saint Holy Tour">
<meta property="og:description" content="WHATUPRG · New Saint Holy Tour. Tour dates, fan POV, the road, and the photobooth.">
<meta property="og:image" content="/frames/houston-3up-tall.png">
<meta name="theme-color" content="#ffffff">
<link rel="icon" type="image/png" href="/frames/star.png">
<link rel="apple-touch-icon" href="/frames/star.png">
<title>New Saint Holy Tour</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Source+Code+Pro:wght@300;400;500&display=swap">
<style>
/* Layout: WHATUPRG's white tour/booking pages + mono nav + stacked date rows, on a yetour-style archive skeleton (tour list → show → fan wall / crew content). Single dark look, Yeezus red tape used once per screen. */
:root{
  --ink:#ffffff; --deep:#f3f3f1; --fg:#111111; --dim:#6b6b6b; --line:#dcdcdc;
  --teal:#1d6b74; --indigo:#2b2c8f; --magenta:#a82d66; --tape:#d3241c; --ok:#5fd08a;
  --f-mark:"Rock Salt","Marker Felt",cursive;
  --f-mono:"Source Code Pro",ui-monospace,Menlo,monospace;
  --f-sans:"Inter","Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--ink);color:var(--fg)}
body{font-family:var(--f-sans);font-size:15px;line-height:1.5;min-height:100vh;overflow-x:hidden}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:1px solid var(--fg);outline-offset:3px}


.wrap{position:relative;z-index:2;max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
.top{display:flex;align-items:center;justify-content:center;gap:24px;flex-wrap:wrap;padding-block:28px 12px}
.mark{font-family:var(--f-mark);font-size:clamp(26px,4vw,38px);text-decoration:none;letter-spacing:-.02em;line-height:1;transform:rotate(-3deg);display:inline-block}
nav{display:flex;gap:clamp(14px,3vw,48px);flex-wrap:wrap;font-family:var(--f-mono);font-weight:300;font-size:15px;letter-spacing:.02em}
nav a{text-decoration:none;padding-bottom:3px;border-bottom:1px solid transparent}
nav a[aria-current="page"]{border-bottom-color:var(--fg)}
nav a:hover{border-bottom-color:var(--dim)}

/* hero */
.hero{padding-block:clamp(40px,7vw,90px) clamp(32px,5vw,64px);text-align:center}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.24em;color:var(--dim);margin:0}
.hero h1{margin:0;font-family:var(--f-mono);font-weight:400;font-size:clamp(24px,3.6vw,42px);line-height:1.1;letter-spacing:-.01em;text-wrap:balance}
.hero h1 b{font-weight:500}
.tape{justify-self:start;background:var(--tape);color:#fff;font-family:var(--f-sans);font-weight:800;font-size:13px;letter-spacing:.3em;padding:6px 14px 6px 16px;transform:rotate(-2deg)}
.hero p.sub{margin:0;max-width:44ch;color:var(--dim);font-family:var(--f-mono);font-size:14px}

/* date rows (WHATUPRG tour list) */
.dates{border-top:1px solid var(--line);margin-bottom:64px}
.row{display:grid;grid-template-columns:84px minmax(0,1fr) auto;align-items:center;gap:20px 28px;padding-block:20px;border-bottom:1px solid var(--line);text-decoration:none;transition:background .2s}
.row:hover{background:var(--deep)}
.d{display:grid;justify-items:center;font-family:var(--f-sans);font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums}
.d .m{font-size:15px}.d .n{font-size:38px;font-weight:800}.d .y{font-size:15px}
.who{min-width:0}
.who .bill{font-size:clamp(16px,2vw,21px);font-weight:500}
.who .city{font-size:clamp(16px,2vw,21px);color:var(--dim)}
.who .meta{display:flex;gap:10px;margin-top:8px;font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;color:var(--dim);flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-width:170px;padding:11px 18px;border:1.5px solid var(--fg);border-radius:3px;background:transparent;font-family:var(--f-sans);font-weight:500;font-size:14px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;text-decoration:none;transition:background .15s,color .15s}
.btn:hover{background:var(--fg);color:var(--ink)}
.btn.solid{background:var(--fg);color:var(--ink)}
.btn.solid:hover{background:transparent;color:var(--fg)}
.btn.small{min-width:0;padding:7px 12px;font-size:12px}
.btn[disabled]{opacity:.4;cursor:default}
.state{font-family:var(--f-mono);font-size:11px;letter-spacing:.18em;padding:3px 8px;border:1px solid var(--line);border-radius:2px}
.state.tonight{background:var(--tape);border-color:var(--tape);color:#fff;animation:pulse 1.6s ease-in-out infinite}
.state.played{border-color:var(--fg);color:var(--fg)}
@keyframes pulse{50%{opacity:.55}}
@media (prefers-reduced-motion:reduce){.state.tonight{animation:none}}

/* section heads + chips */
.head{text-align:center;padding-block:clamp(40px,7vw,90px) 28px}
.head h2{margin:0;font-family:var(--f-mono);font-weight:400;font-size:clamp(24px,3.6vw,42px);letter-spacing:-.01em;line-height:1.1;text-transform:none}
.head p{margin:8px 0 0;color:var(--dim);font-family:var(--f-mono);font-size:13px;max-width:52ch}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;padding-block:6px 22px;font-family:var(--f-mono);font-size:12px;letter-spacing:.12em}
.chip{background:none;border:1px solid var(--line);padding:6px 12px;border-radius:2px;cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--fg);background:var(--fg);color:var(--ink)}
.chips{gap:clamp(14px,3vw,36px);font-size:15px;font-weight:300;letter-spacing:.02em}
.chips .chip{border:0;border-radius:0;padding:0 0 3px;color:var(--dim);border-bottom:1px solid transparent}
.chips .chip:hover{color:var(--fg)}
.chips .chip[aria-pressed="true"]{background:none;color:var(--fg);border-bottom-color:var(--fg)}

/* show header */
.showhead{display:grid;grid-template-columns:auto minmax(0,1fr);gap:28px;align-items:center;padding-block:48px 28px;border-bottom:1px solid var(--line)}
.showhead .d .n{font-size:clamp(40px,6vw,64px)}
.showhead .d .m,.showhead .d .y{font-size:18px}
.showhead h2{margin:0 0 6px;font-family:var(--f-mono);font-weight:300;font-size:clamp(22px,3.2vw,36px);letter-spacing:-.03em;line-height:1}
.back{font-family:var(--f-mono);font-size:12px;letter-spacing:.14em;color:var(--dim);text-decoration:none;display:inline-block;margin-top:28px}
.back:hover{color:var(--fg)}
.tabs{display:flex;gap:0;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:22px}
.tab{background:none;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;padding:16px 18px 12px 0;margin-right:22px;font-family:var(--f-mono);font-size:13px;letter-spacing:.14em;cursor:pointer;color:var(--dim)}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--fg)}
.tab .c{font-variant-numeric:tabular-nums;opacity:.7;margin-left:6px}
.tab{text-decoration:none}
.bar{display:flex;justify-content:center;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.bar p{margin:0;color:var(--dim);font-family:var(--f-mono);font-size:13px;max-width:56ch}

/* gallery */
.grid{columns:3 260px;column-gap:12px;margin-bottom:72px}
.tile{break-inside:avoid;margin:0 0 12px;position:relative;cursor:zoom-in;background:var(--deep);border-radius:2px;overflow:hidden;display:block;width:100%;border:0;padding:0;text-align:left}
.tile img,.tile video{display:block;width:100%;height:auto}
.tile .cap{position:absolute;inset:auto 0 0;padding:28px 12px 10px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.7));font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;display:flex;justify-content:space-between;gap:8px;opacity:0;transition:opacity .2s}
.tile:hover .cap,.tile:focus-visible .cap{opacity:1}
.tile .vid{position:absolute;top:10px;right:10px;font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;color:#fff;background:rgba(0,0,0,.6);padding:3px 7px;border-radius:2px}
.empty{border:1px dashed var(--line);padding:56px 24px;text-align:center;font-family:var(--f-mono);color:var(--dim);font-size:13px;margin-bottom:72px;display:grid;gap:14px;justify-items:center}
.empty strong{color:var(--fg);font-weight:400;font-size:16px;letter-spacing:.04em}
/* photobooth */
.booth{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,300px);gap:32px;align-items:start;margin-bottom:72px}
.stage{display:grid;justify-items:center;gap:12px;min-width:0}
.stage canvas{max-width:100%;max-height:78vh;width:auto;height:auto;touch-action:none;cursor:grab;border:1px solid var(--line)}
.stage canvas.drag{cursor:grabbing}
.stage .hint{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;color:var(--dim);margin:0;text-align:center}
.ctrl{display:grid;gap:22px;font-family:var(--f-mono)}
.ctrl .grp{display:grid;gap:8px}
.ctrl .lbl{font-size:11px;letter-spacing:.16em;color:var(--dim)}
.ctrl select{background:var(--ink);border:1px solid var(--line);padding:10px 12px;border-radius:2px;font-family:var(--f-mono);font-size:13px}
.seg{display:flex;gap:6px}
.seg .chip{flex:1}
.slots{display:grid;gap:6px}
.slot{display:flex;gap:6px}
.slot .chip{flex:1;text-align:left}
.slot .chip.clr{flex:0 0 auto}
@media (max-width:820px){.booth{grid-template-columns:1fr}.stage canvas{max-height:70vh}}

.droplink{background:none;border:0;padding:0 0 3px;border-bottom:1px solid var(--fg);font-family:var(--f-mono);font-weight:300;font-size:15px;cursor:pointer;color:var(--fg)}
.droplink .mob{display:none}
@media (hover:none),(max-width:640px){.droplink .desk{display:none}.droplink .mob{display:inline}}
.dragcover{position:fixed;inset:0;z-index:25;background:rgba(255,255,255,.92);display:flex;align-items:center;justify-content:center;font-family:var(--f-mono);font-size:clamp(28px,5vw,56px);font-weight:300;outline:2px dashed var(--fg);outline-offset:-16px;pointer-events:none}
/* review queue */
.queue{border:1px solid var(--tape);padding:18px;margin-bottom:28px;display:grid;gap:14px}
.queue h3{margin:0;font-family:var(--f-mono);font-weight:400;font-size:13px;letter-spacing:.16em;color:var(--fg)}
.qlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.qitem{display:grid;gap:8px;font-family:var(--f-mono);font-size:11px;color:var(--dim);min-width:0}
.qitem img,.qitem video{width:100%;aspect-ratio:4/5;object-fit:cover;background:var(--deep);border-radius:2px}
.qitem .acts{display:flex;gap:6px}
.qitem p{margin:0;overflow-wrap:anywhere}

/* sheet + lightbox */
.overlay{position:fixed;inset:0;z-index:20;background:rgba(255,255,255,.94);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.panel{width:min(520px,100%);max-height:100%;overflow:auto;background:var(--ink);border:1px solid var(--line);padding:26px;display:grid;gap:16px}
.panel h3{margin:0;font-family:var(--f-mono);font-weight:300;font-size:26px;letter-spacing:-.02em}
.panel label{display:grid;gap:6px;font-family:var(--f-mono);font-size:11px;letter-spacing:.16em;color:var(--dim)}
.panel input[type=text],.panel select,.panel textarea{background:var(--ink);border:1px solid var(--line);padding:11px 12px;border-radius:2px;font-family:var(--f-mono);font-size:14px;letter-spacing:0;color:var(--fg)}
.panel textarea{resize:vertical;min-height:70px}
.drop{border:1px dashed var(--dim);padding:26px;text-align:center;cursor:pointer;font-family:var(--f-mono);font-size:12px;letter-spacing:.14em;color:var(--dim);display:grid;gap:10px;justify-items:center}
.drop img,.drop video{max-height:220px;width:auto;max-width:100%}
.drop input{position:absolute;width:1px;height:1px;opacity:0}
.panel .row2{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.panel .note{margin:0;font-family:var(--f-mono);font-size:11px;color:var(--dim)}
.err{color:#c0271f;font-family:var(--f-mono);font-size:12px;margin:0}
.lb{position:relative;max-width:min(1100px,100%);max-height:100%;display:grid;gap:12px}
.lb img,.lb video{max-width:100%;max-height:78vh;margin:0 auto;display:block}
.lb .info{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-family:var(--f-mono);font-size:12px;color:var(--dim)}
.lb .info b{color:var(--fg);font-weight:400}
.x{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));right:calc(14px + env(safe-area-inset-right,0px));background:none;border:1px solid var(--line);width:40px;height:40px;cursor:pointer;font-family:var(--f-mono);font-size:16px;z-index:21}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;background:var(--fg);color:var(--ink);font-family:var(--f-mono);font-size:13px;padding:10px 16px;border-radius:2px;max-width:calc(100% - 32px)}
.status{font-family:var(--f-mono);font-size:12px;color:var(--dim);margin-bottom:12px}

footer{border-top:1px solid var(--line);padding-block:26px 40px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;color:var(--dim)}
footer a{text-decoration:none;color:var(--fg)}

@media (max-width:640px){
  .row{grid-template-columns:64px minmax(0,1fr)}
  .row .btn{grid-column:1/-1;width:100%}
  .d .n{font-size:30px}
  .showhead{grid-template-columns:1fr;gap:12px}
  .showhead .d{justify-items:start;display:flex;gap:10px;align-items:baseline}
  .grid{columns:2 140px;column-gap:8px}.tile{margin-bottom:8px}
  .tile .cap{opacity:1}
}

/* ---- minimal pass ---- */
.hero{padding-block:clamp(48px,9vw,120px) clamp(28px,4vw,48px)}
.hero h1{font-weight:300;font-size:15px;letter-spacing:.02em;text-transform:uppercase}
.hero p{margin:6px 0 0;font-family:var(--f-mono);font-weight:300;font-size:13px;color:var(--dim)}
.stops{display:grid;margin-bottom:clamp(64px,10vw,140px)}
.stop{display:grid;grid-template-columns:minmax(0,1fr);justify-items:center;gap:2px;text-decoration:none;padding-block:clamp(10px,2vw,22px)}
.when{font-family:var(--f-mono);font-weight:300;font-size:13px;letter-spacing:.06em;color:var(--dim);display:inline-flex;align-items:center;gap:8px}
.town{font-family:var(--f-sans);font-weight:800;text-transform:uppercase;letter-spacing:-.045em;line-height:.88;font-size:clamp(44px,11vw,150px);text-align:center;transition:color .2s}
.stops:hover .town{color:#cfcfcf}
.stops .stop:hover .town,.stops .stop:focus-visible .town{color:var(--fg)}
.stop.played .town{color:#bdbdbd}
.live{width:8px;height:8px;border-radius:50%;background:var(--tape);display:inline-block;animation:pulse 1.6s ease-in-out infinite}
.stop.tonight .when{color:var(--tape)}
.showtop{display:flex;justify-content:center;align-items:center;gap:18px;padding-block:clamp(40px,7vw,90px) 6px}
.showtop .back{margin:0;font-size:15px}
.town.big{margin:0 0 clamp(24px,4vw,48px);display:block}
.tabs{justify-content:center;border-bottom:0;gap:clamp(14px,3vw,36px);margin-bottom:28px}
.tab{margin:0;padding:0 0 3px;border-bottom:1px solid transparent;font-size:15px;font-weight:300;letter-spacing:.02em}
.tab[aria-selected="true"]{border-bottom-color:var(--fg)}
.tab .c{display:none}
.head{padding-block:clamp(48px,9vw,120px) 18px}
.head h2{font-weight:300;font-size:15px;letter-spacing:.02em;text-transform:uppercase}
.empty{border:0;padding:48px 0 96px;font-size:13px;font-weight:300}
.grid{column-gap:6px}.tile{margin-bottom:6px;border-radius:0}
footer{border-top:0;justify-content:center;padding-block:24px 40px;font-size:11px}
.stage canvas{border:0;box-shadow:0 0 0 1px var(--line)}
.ctrl .chip{border:0;border-bottom:1px solid transparent;border-radius:0;padding:0 0 3px;color:var(--dim);font-size:14px;background:none}
.ctrl .chip:hover{color:var(--fg)}
.ctrl .chip[aria-pressed="true"]{background:none;color:var(--fg);border-bottom-color:var(--fg)}
.seg{gap:22px}.seg .chip{flex:0 0 auto}
.slot .chip{flex:0 0 auto;color:var(--fg)}
.slots{gap:10px}
.ctrl select{border:0;border-bottom:1px solid var(--fg);border-radius:0;padding:6px 0;font-size:14px}
@media (max-width:640px){.town{letter-spacing:-.04em}}
.no-star .star,.no-star .dust{display:none}
.dust{position:fixed;inset:0;width:100%;height:100%;z-index:14;pointer-events:none}
.star{position:fixed;left:0;top:0;width:clamp(64px,7vw,96px);height:auto;z-index:15;cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-user-drag:none;will-change:transform;filter:drop-shadow(0 10px 14px rgba(0,0,0,.12))}
@media (max-width:699px){
  .hero{padding-block:28px 14px}
  .stops{margin-bottom:24px;gap:0;min-height:calc(100svh - 250px);align-content:center}
  .stop{padding-block:4px;justify-items:center}
  .town{display:block;white-space:nowrap;text-align:center;line-height:.84;letter-spacing:-.04em}
  .stops:hover .town{color:var(--fg)}
  .stop.played .town{color:#bdbdbd}
  .town.big{text-align:center;white-space:nowrap}
  .showtop{justify-content:center;padding-block:28px 6px}
}
.in-show .top{display:none}
.showtabs{padding-block:28px 12px;margin:0;flex-wrap:wrap}
.showtabs .tab{color:var(--fg)}
.showtabs .tab[aria-selected="false"]{color:var(--fg)}
.showtabs .tab:hover{border-bottom-color:var(--dim)}
.showtabs .tab[aria-selected="true"]{border-bottom-color:var(--fg)}
.booth-back{justify-content:center}
.back-btn{font-weight:400}
.showtabs + .showtop{padding-block:clamp(40px,7vw,90px) 6px}
@media (max-width:699px){.showtabs{gap:14px}.showtabs + .showtop{padding-block:28px 6px}}
/* nav items read as separate links: no-wrap items with faint slashes between */
nav[aria-label=Main],.showtabs{--g:clamp(26px,4vw,52px);gap:8px var(--g);justify-content:center}
nav[aria-label=Main] a,.showtabs .tab{position:relative;white-space:nowrap}
nav[aria-label=Main] a + a::before,.showtabs .tab + .tab::before{content:"/";position:absolute;left:calc(var(--g) / -2);transform:translateX(-50%);color:#c4c4c4;font-weight:300;pointer-events:none}
@media (max-width:699px){nav[aria-label=Main],.showtabs{--g:22px;font-size:14px}.showtabs .tab{font-size:14px}}
.years{display:flex;justify-content:center;gap:8px 26px;flex-wrap:wrap;padding-block:clamp(28px,5vw,56px) 0;font-family:var(--f-mono);font-weight:300;font-size:13px;color:var(--dim)}
.years a{text-decoration:none;padding-bottom:2px;border-bottom:1px solid transparent;font-variant-numeric:tabular-nums}
.years a:hover{color:var(--fg)}
.years a[aria-current="page"]{color:var(--fg);border-bottom-color:var(--fg)}
.years + .hero{padding-top:clamp(18px,3vw,40px)}
.stops.archive:hover .town{color:var(--fg)}
.stop.past{cursor:default;padding-block:clamp(6px,1.2vw,14px)}
.archive .town{font-size:clamp(40px,7.5vw,108px)}
.sold{font-weight:400;color:var(--tape)}
.hero .tsub{margin:6px auto 0;max-width:46ch;font-family:var(--f-mono);font-weight:300;font-size:12px;color:var(--dim);text-wrap:balance}
.wrap{display:flex;flex-direction:column;min-height:100svh}
#app{flex:1 0 auto}
footer{margin-top:auto;padding-block:40px max(20px,env(safe-area-inset-bottom,0px));font-size:11px;letter-spacing:.14em;color:var(--dim)}
footer a{color:var(--fg);border-bottom:1px solid var(--fg);padding-bottom:1px}
/* city filters: bold sans, not the mono nav look, with dots between */
.chips{--cg:clamp(28px,4vw,48px);gap:10px var(--cg);padding-block:4px 30px;font-family:var(--f-sans)}
.chips .chip{position:relative;white-space:nowrap;font-family:var(--f-sans);font-weight:800;font-size:clamp(17px,2.2vw,22px);letter-spacing:-.02em;color:#c2c2c2;border-bottom:0;padding:0}
.chips .chip:hover{color:var(--fg)}
.chips .chip[aria-pressed="true"]{color:var(--fg)}

<body>


<div class="wrap">
  <header class="top">
    <nav aria-label="Main">
      <a href="#tour" data-nav="tour">TOUR</a>
      <a href="#fans" data-nav="fans">POV</a>
      <a href="#content" data-nav="content">ROAD</a>
      <a href="#booth" data-nav="booth">PHOTOBOOTH</a>
    </nav>
  </header>
  <main id="app"></main>
  <footer>
    <a class="terms-link" href="#terms">TERMS</a>
    <span>POWERED BY <a href="https://art-house.us" target="_blank" rel="noopener">ARTHOUSE</a></span>
  </footer>
</div>

<input type="file" id="dropInput" accept="image/*,video/*" multiple hidden>
<input type="file" id="teamFile" accept="image/*,video/*" multiple hidden>
<div class="dragcover" id="dragCover" hidden><span>DROP TO POST</span></div>

<div class="overlay" id="lightbox" hidden>
  <button class="x" id="lbClose" aria-label="Close">✕</button>
  <div class="lb" id="lbBody"></div>
</div>
<a class="teamdot" href="#team" aria-label="Team"><i></i><b id="teamCount" hidden></b></a>
<canvas class="dust" id="dust" aria-hidden="true"></canvas>
<img class="star" id="star" src="frames/star.png" alt="" aria-hidden="true" draggable="false">
<div class="toast" id="toast" role="status" hidden></div>

<script type="module">
import { SHOWS } from "/shows.js";
(() => {
  // ---- Tour routing (edit / extend here) ----
  const MAX_BYTES = 150 * 1024 * 1024; // Dropbox direct-upload limit
  const MON = ["JAN.","FEB.","MAR.","APR.","MAY","JUN.","JUL.","AUG.","SEP.","OCT.","NOV.","DEC."];

  const $ = s => document.querySelector(s);
  const app = $("#app");
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const byId = id => SHOWS.find(s => s.id === id);
  const today = () => { const d = new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
  const status = s => s.date === today() ? "tonight" : (s.date < today() ? "played" : "upcoming");
  const parts = s => { const [y,m,d] = s.date.split("-"); return {y, m:MON[+m-1], d:String(+d)}; };
  const dateBlock = s => { const p = parts(s); return `<div class="d"><span class="m">${p.m}</span><span class="n">${p.d}</span><span class="y">${p.y}</span></div>`; };
  const stateTag = s => { const st = status(s); return `<span class="state ${st}">${st === "tonight" ? "TONIGHT" : st === "played" ? "PLAYED" : "UPCOMING"}</span>`; };
  const enc = encodeURIComponent;
  const src = (r, size = "m") => r.type === "video" ? "/api/file?path=" + enc(r.path) : `/api/thumb?size=${size}&rev=${enc(r.rev || "")}&path=${enc(r.path)}`;
  const isVid = r => String(r.type || "").startsWith("video");

  // ---- state ----
  const S = { fans:[], crew:[], inbox:[], loaded:{fans:false,crew:false}, stale:false, admin:false, canPost:false,
              filter:{fans:"all",content:"all"}, showTab:"fans", crewer:false };

  function toast(msg, ms = 3400){ const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(() => t.hidden = true, ms); }

  // ---- views ----
  // Past tours: dates only. Add a tour here and its year shows up in the picker.
  const SHOW_ARCHIVE = false; // past tours are kept here but hidden; flip to true to bring them back
  const ARCHIVE_ALL = [
    { year: 2024, name: "Glory Nights Tour", sub: "KB · w/ nobigdyl., Limoblaze, WHATUPRG", shows: [
      ["2024-04-04","Omaha"],["2024-04-05","Arden Hills"],["2024-04-06","Glenview"],["2024-04-07","Anderson"],["2024-04-09","Columbus"],
      ["2024-04-11","Kansas City"],["2024-04-12","Allen"],["2024-04-13","Metairie"],["2024-04-14","Webster"],["2024-04-18","Roswell"],
      ["2024-04-19","Winter Garden"],["2024-04-20","Hollywood"],["2024-04-21","Ponte Vedra Beach"],["2024-04-23","Nashville"],
      ["2024-04-25","Bensalem"],["2024-04-26","Parsippany"],["2024-04-27","Vienna"],["2024-04-28","Charlotte"],
      ["2024-05-17","Stockton"],["2024-05-18","Los Angeles"],["2024-05-19","Mesa"] ] },
    { year: 2021, name: "We Are Unashamed Tour", sub: "1K Phew · Andy Mineo · Gawvi · Hulvey · Lecrae · Tedashii · Trip Lee · Wande · WHATUPRG", shows: [
      ["2021-03-17","Austin"],["2021-03-18","Houston"],["2021-03-19","San Antonio"],["2021-03-24","Chicago"],["2021-03-25","Cincinnati"],
      ["2021-03-26","Indianapolis"],["2021-03-27","Columbus"],["2021-03-31","St. Louis"],["2021-04-01","Tulsa"],["2021-04-02","Dallas"],
      ["2021-04-07","Birmingham"],["2021-04-08","Jacksonville"],["2021-04-09","Ft. Lauderdale"],["2021-04-10","Orlando"] ] },
    { year: 2019, name: "The Saint Holy Tour", shows: [
      ["2019-07-31","Atlanta",1],["2019-08-22","Dallas",1],["2019-08-23","Houston",1],["2019-08-25","San Antonio",1],
      ["2019-09-04","Los Angeles",1],["2019-09-06","San Jose"],["2019-09-08","Phoenix"],["2019-09-18","Kansas City"],
      ["2019-09-21","Chicago",1],["2019-09-22","Toronto",1],["2019-09-24","Philadelphia"],["2019-09-26","Lynchburg"],
      ["2019-10-05","Miami"],["2019-10-06","Orlando"] ] },
    { year: 2018, name: "Better Late Than Never Tour", sub: "Lecrae + Andy Mineo · w/ WordsPlayed, nobigdyl., WHATUPRG", shows: [
      ["2018-09-21","Kansas City"],["2018-09-23","Denver"],["2018-09-27","Spokane"],["2018-09-28","Seattle"],["2018-09-29","Vancouver"],["2018-09-30","Portland"],
      ["2018-10-02","Sacramento"],["2018-10-03","San Francisco"],["2018-10-04","Fresno"],["2018-10-05","Los Angeles"],["2018-10-06","Riverside"],["2018-10-07","Phoenix"],
      ["2018-10-11","Midland"],["2018-10-12","San Antonio"],["2018-10-13","Houston"],["2018-10-16","Oklahoma City"],["2018-10-18","Saint Paul"],["2018-10-19","Milwaukee"],
      ["2018-10-22","Chicago"],["2018-10-23","Cincinnati"],["2018-10-24","Memphis"],["2018-10-26","Nashville"],["2018-10-29","Silver Spring"],["2018-10-30","Philadelphia"],
      ["2018-11-01","Worcester"],["2018-11-02","New York"],["2018-11-03","Shippensburg"],["2018-11-05","Toronto"],["2018-11-06","Pittsburgh"],["2018-11-08","Detroit"],
      ["2018-11-09","Indianapolis"],["2018-11-10","Columbus"],["2018-11-11","Grand Rapids"] ] },
  ];
  const ARCHIVE = SHOW_ARCHIVE ? ARCHIVE_ALL : [];
  const CURRENT_YEAR = 2026;
  const YEARS = [CURRENT_YEAR, ...ARCHIVE.map(t => t.year)].filter((y, i, a) => a.indexOf(y) === i).sort((a, b) => b - a);
  function yearPicker(cur){
    if (YEARS.length < 2) return "";
    return `<nav class="years" aria-label="Year">${YEARS.map(y => `<a href="#${y === CURRENT_YEAR ? "tour" : "tour-" + y}" ${y === cur ? 'aria-current="page"' : ""}>${y}</a>`).join("")}</nav>`;
  }
  function viewTour(year){
    year = year || CURRENT_YEAR;
    if (year !== CURRENT_YEAR) {
      const tours = ARCHIVE.filter(t => t.year === year);
      return yearPicker(year) + tours.map(t => {
        const rows = t.shows.map(([d, city, sold]) => {
          const [, m, dd] = d.split("-");
          return `<div class="stop past"><span class="when">${MON[+m-1].replace(".","")} ${+dd}${sold ? ` · <b class="sold">SOLD OUT</b>` : ""}</span><span class="town">${esc(city)}</span></div>`;
        }).join("");
        return `<section class="hero"><h1>${esc(t.name)}</h1>${t.sub ? `<p class="tsub">${esc(t.sub)}</p>` : ""}</section><div class="stops archive">${rows}</div>`;
      }).join("");
    }
    const rows = SHOWS.map(s => {
      const p = parts(s), st = status(s);
      return `<a class="stop ${st}" href="#show-${s.id}">
        <span class="when">${st === "tonight" ? `<i class="live" aria-hidden="true"></i>TONIGHT` : `${p.m.replace(".","")} ${p.d}`}</span>
        <span class="town">${esc(s.city)}</span></a>`;
    }).join("");
    return `${yearPicker(CURRENT_YEAR)}<section class="hero"><h1>New Saint Holy Tour</h1></section>
      <div class="stops">${rows}</div>`;
  }

  function chips(kind){
    const cur = S.filter[kind];
    const b = (id, label) => `<button class="chip" data-chip="${kind}" data-v="${id}" aria-pressed="${cur===id}">${label}</button>`;
    return `<div class="chips" role="group" aria-label="Filter by show">${SHOWS.map(s => b(s.id, esc(s.city.toUpperCase()))).join("")}</div>`;
  }

  // Road: US map in the tour-tee sketch style, with a star per city. Tap a star to see that city.
  function roadMap(){
    const cur = S.filter.content;
    const pins = SHOWS.filter(s => s.pin).map(s => {
      const on = cur === s.id, st = status(s), p = parts(s);
      return `<button class="pin ${on ? "on" : ""} ${st} side-${s.pin.side || "l"}" style="left:${s.pin.x}%;top:${s.pin.y}%" data-chip="content" data-v="${s.id}" aria-pressed="${on}" aria-label="${esc(s.city)}, ${p.m.replace(".","")} ${p.d}">
        <img src="/frames/star.png" alt=""><span class="lbl">${esc(s.city.toUpperCase())}<small>${st === "tonight" ? "TONIGHT" : p.m.replace(".","") + " " + p.d}</small></span></button>`;
    }).join("");
    return `<div class="mapscroll"><div class="txmap ${cur !== "all" ? "picked" : ""}"><img class="tx" src="/frames/us.png" alt="Map of the United States with the tour stops">${pins}</div></div>
      <p class="maphint">${cur === "all" ? "Tap a star" : "&nbsp;"}</p>`;
  }

  function updateRoadMap(){
    const cur = S.filter.content;
    $(".txmap").classList.toggle("picked", cur !== "all");
    document.querySelectorAll(".txmap .pin").forEach(p => { const on = p.dataset.v === cur; p.classList.toggle("on", on); p.setAttribute("aria-pressed", on); });
    $(".maphint").innerHTML = cur === "all" ? "Tap a star" : "&nbsp;";
    $("#listBody").innerHTML = crewSection(cur === "all" ? null : cur);
  }

  function gallery(list, emptyHtml){
    if (!list.length) return `<div class="empty">${emptyHtml}</div>`;
    return `<div class="grid">${list.map(r => {
      const s = byId(r.show);
      const media = isVid(r) ? `<video src="${src(r)}" muted playsinline preload="metadata"></video><span class="vid">VIDEO</span>` : `<img src="${src(r)}" alt="${esc("Photo from " + (s ? s.city : "the tour"))}" loading="lazy">`;
      return `<button class="tile" data-open="${esc(r._kind)}:${esc(r._id)}">${media}<span class="cap"><span>${r._kind === "crew" ? "ROAD" : "POV"}</span><span>${s ? esc(s.city.toUpperCase()) : ""}</span></span></button>`;
    }).join("")}</div>`;
  }

  function loadingNote(kind){
    if (!S.loaded[kind]) return `<p class="status">${S.stale ? "Can't reach the wall right now. Showing what we have." : "Loading the wall…"}</p>`;
    return "";
  }

  function queueHtml(showId){
    return "";
    const q = S.inbox.filter(r => !showId || r.show === showId);
    if (!q.length) return "";
    return `<div class="queue"><h3>REVIEW QUEUE · ${q.length} WAITING</h3><div class="qlist">${q.map(r => {
      const s = byId(r.show);
      const m = isVid(r) ? `<video src="${src(r)}" muted playsinline preload="metadata" controls></video>` : `<img src="${src(r)}" alt="">`;
      return `<div class="qitem">${m}<p>${esc(s ? s.city : r.show)} · ${esc(r.handle || "no handle")}</p>${r.caption ? `<p>“${esc(r.caption)}”</p>` : ""}
        <div class="acts"><button class="btn small solid" data-approve="${esc(r._id)}">Approve</button><button class="btn small" data-reject="${esc(r._id)}">Reject</button></div></div>`;
    }).join("")}</div></div>`;
  }

  function fanSection(showId){
    const list = S.fans.filter(r => !showId || r.show === showId);
    const btn = S.canPost ? `<button class="droplink" data-drop="fans" data-show="${showId || ""}"><span class="desk">+ Drop yours anywhere</span><span class="mob">+ Add yours</span></button>` : "";
    const s = showId && byId(showId);
    const empty = s && status(s) === "upcoming"
      ? `Opens ${parts(s).m.replace(".","")} ${parts(s).d}.`
      : `Nothing yet.`;
    return `${queueHtml(showId)}${btn ? `<div class="bar">${btn}</div>` : ""}${loadingNote("fans")}${gallery(list, empty)}${btn ? `<p class="agree">Uploading gives us the right to use and share it. <a href="#terms">Terms</a></p>` : ""}`;
  }

  function crewSection(showId){
    const list = S.crew.filter(r => !showId || r.show === showId);
    const btn = (S.admin || S.crewer) ? `<button class="droplink" data-drop="crew" data-show="${showId || ""}"><span class="desk">+ Drop content anywhere</span><span class="mob">+ Add content</span></button>` : "";
    const body = gallery(list, `Nothing yet.`);
    return `${btn ? `<div class="bar">${btn}</div>` : ""}${loadingNote("crew")}${body}`;
  }

  function viewTerms(){
    return `<article class="terms">
      <h2>POV Terms</h2>
      <p class="eff">New Saint Holy Tour · Effective November 3, 2026</p>
      <p>These terms cover anything you post to POV on this site: photos, videos, captions and anything else you upload ("your content"). By posting, you agree to them. If you don't agree, don't post.</p>
      <h3>1. Who "we" are</h3>

    va *= Math.pow(.2, dt);
    ang = (ang + va * dt) % 360;
    const sway = still ? 0 : Math.sin(t * 1.1) * 6, bob = still ? 0 : Math.sin(t * 1.7) * 5;
    if (shed > 0) { shed -= dt; if (Math.random() < .22) emit(1); }
    if (dust.length || shed > 0) drawDust(dt); else if (drawDust.dirty !== false) { drawDust(dt); drawDust.dirty = false; }
    if (dust.length) drawDust.dirty = true;
    el.style.transform = `translate3d(${x.toFixed(1)}px, ${(y + bob).toFixed(1)}px, 0) rotate(${(ang + sway).toFixed(1)}deg)`;
    requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
})();
</script>
